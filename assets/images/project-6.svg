<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#02040f"/>
    </linearGradient>
    <filter id="ecgGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p6Bg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#09122c"/>
  <circle cx="28" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="46" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>
  <text x="95" y="25" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">NEODOC BIOMETRIC TELEMETRY</text>

  <!-- Realtime ECG Card -->
  <rect x="25" y="60" width="370" height="175" rx="8" fill="rgba(8, 17, 43, 0.85)" stroke="rgba(16, 185, 129, 0.2)"/>
  <text x="45" y="85" fill="#94a3b8" font-size="11">CARDIAC TELEMETRY CHANNEL 01</text>
  <text x="290" y="85" fill="#10b981" font-size="11" font-weight="bold">72 BPM NORMAL</text>

  <!-- ECG Grid Lines -->
  <line x1="45" y1="110" x2="375" y2="110" stroke="rgba(16, 185, 129, 0.1)"/>
  <line x1="45" y1="145" x2="375" y2="145" stroke="rgba(16, 185, 129, 0.1)"/>
  <line x1="45" y1="180" x2="375" y2="180" stroke="rgba(16, 185, 129, 0.1)"/>

  <!-- ECG Trace Path -->
  <path d="M 45 145 H 100 L 110 135 L 120 155 L 130 95 L 145 195 L 155 145 L 180 145 L 195 130 L 210 145 H 250 L 260 135 L 270 155 L 280 95 L 295 195 L 305 145 L 330 145 L 345 130 L 360 145 H 375" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#ecgGlow)"/>

  <!-- Vital Metrics Column -->
  <rect x="410" y="60" width="165" height="82" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="425" y="82" fill="#94a3b8" font-size="10">OXYGEN SATURATION</text>
  <text x="425" y="112" fill="#00f5ff" font-size="24" font-weight="bold">99%</text>
  <text x="480" y="112" fill="#10b981" font-size="11">SpO2 Stable</text>

  <rect x="410" y="153" width="165" height="82" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="425" y="175" fill="#94a3b8" font-size="10">BLOOD PRESSURE</text>
  <text x="425" y="205" fill="#a855f7" font-size="22" font-weight="bold">118 / 78</text>
  <text x="515" y="205" fill="#94a3b8" font-size="9">mmHg</text>

  <!-- Bottom Logs & Telemetry -->
  <rect x="25" y="250" width="550" height="85" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)"/>
  <text x="40" y="275" fill="#38bdf8" font-size="11" font-weight="bold">[SYSTEM STATUS]</text>
  <text x="160" y="275" fill="#94a3b8" font-size="11">All patient telemetry feeds synchronized over secure TLS 1.3 socket stream</text>
  <text x="40" y="305" fill="#10b981" font-size="11" font-weight="bold">[FHIR HL7 COMPLIANT]</text>
  <text x="185" y="305" fill="#94a3b8" font-size="11">Automated triage algorithms active • 0 unhandled alerts</text>
</svg>
