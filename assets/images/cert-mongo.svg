<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ed64"/>
      <stop offset="100%" stop-color="#00684a"/>
    </linearGradient>
    <filter id="mongoGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="#081423" stroke="url(#mongoGrad)" stroke-width="3" filter="url(#mongoGlow)"/>
  <polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="rgba(0, 237, 100, 0.08)" stroke="rgba(0, 237, 100, 0.3)" stroke-width="1.5"/>
  <!-- Leaf icon -->
  <path d="M 100 80 C 120 95, 125 115, 100 132 C 75 115, 80 95, 100 80 Z" fill="rgba(0, 237, 100, 0.4)" stroke="#00ed64" stroke-width="2.5"/>
  <line x1="100" y1="88" x2="100" y2="128" stroke="#00ed64" stroke-width="1.5"/>
  <text x="100" y="70" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" letter-spacing="1">MONGODB</text>
  <text x="100" y="145" text-anchor="middle" fill="#00ed64" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" letter-spacing="1">CERTIFIED</text>
  <text x="100" y="158" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">DEVELOPER</text>
</svg>
