<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050819"/>
      <stop offset="50%" stop-color="#0b1335"/>
      <stop offset="100%" stop-color="#06091d"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>
  <rect width="500" height="500" rx="250" fill="url(#gridPattern)"/>

  <!-- Concentric Cyber Orbit Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6" filter="url(#glowCyan)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#neonPurple)" stroke-width="2" stroke-dasharray="30 15 10 15" opacity="0.7" filter="url(#glowPurple)"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

  <!-- Rotating Indicator Accents -->
  <circle cx="250" cy="20" r="4" fill="#00f5ff" filter="url(#glowCyan)"/>
  <circle cx="460" cy="250" r="4" fill="#c084fc" filter="url(#glowPurple)"/>
  <circle cx="250" cy="480" r="4" fill="#00f5ff" filter="url(#glowCyan)"/>
  <circle cx="40" cy="250" r="4" fill="#f43f5e"/>

  <!-- HUD Corner Markers -->
  <path d="M 120 120 L 100 120 L 100 140" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.8"/>
  <path d="M 380 120 L 400 120 L 400 140" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.8"/>
  <path d="M 100 360 L 100 380 L 120 380" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.8"/>
  <path d="M 400 360 L 400 380 L 380 380" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.8"/>

  <!-- Stylized Developer Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 140 430 C 140 340 180 320 250 320 C 320 320 360 340 360 430 Z" fill="url(#neonPurple)" opacity="0.35"/>
  <path d="M 160 430 C 160 360 195 335 250 335 C 305 335 340 360 340 430 Z" fill="none" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glowCyan)"/>

  <!-- Head & Cyber Headset / Hair -->
  <ellipse cx="250" cy="225" rx="65" ry="75" fill="#0c122c" stroke="url(#neonPurple)" stroke-width="2.5"/>
  
  <!-- Cyber Visor / Glasses Glowing -->
  <path d="M 200 205 Q 250 215 300 205 L 302 225 Q 250 240 198 225 Z" fill="url(#neonCyan)" opacity="0.9" filter="url(#glowCyan)"/>
  <line x1="205" y1="216" x2="295" y2="216" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Sci-Fi Headset & Audio Ring -->
  <path d="M 178 190 Q 250 140 322 190" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round"/>
  <rect x="172" y="195" width="14" height="35" rx="7" fill="#00f5ff" filter="url(#glowCyan)"/>
  <rect x="314" y="195" width="14" height="35" rx="7" fill="#00f5ff" filter="url(#glowCyan)"/>

  <!-- Code Bracket Symbols Floating -->
  <text x="105" y="255" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00f5ff" opacity="0.75" filter="url(#glowCyan)">&lt;/&gt;</text>
  <text x="360" y="255" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#c084fc" opacity="0.75" filter="url(#glowPurple)">{ ; }</text>

  <!-- Status Hologram Badge -->
  <g transform="translate(160, 420)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(6, 11, 30, 0.9)" stroke="#00f5ff" stroke-width="1.5" filter="url(#glowCyan)"/>
    <circle cx="20" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1">DEV IDENTIFIED</text>
  </g>
</svg>
