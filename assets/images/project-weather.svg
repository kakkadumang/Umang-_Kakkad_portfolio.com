<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071129"/>
      <stop offset="100%" stop-color="#020717"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="weatherGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect width="600" height="360" rx="16" fill="url(#weatherBg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.5"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0c1638"/>
  <path d="M0 26 h600 v16 h-600 z" fill="#0c1638"/>
  <circle cx="28" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="46" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>
  <!-- URL Bar -->
  <rect x="160" y="12" width="280" height="18" rx="9" fill="rgba(255, 255, 255, 0.06)"/>
  <text x="220" y="25" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">weather-forecast.django.app</text>

  <!-- Weather Search Bar Mock -->
  <rect x="25" y="58" width="550" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(0, 245, 255, 0.2)"/>
  <circle cx="50" cy="81" r="6" fill="none" stroke="#00f5ff" stroke-width="2"/>
  <line x1="55" y1="85" x2="62" y2="92" stroke="#00f5ff" stroke-width="2"/>
  <text x="75" y="86" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Ahmedabad, Gujarat &#8226; Current Location</text>
  <rect x="475" y="68" width="85" height="26" rx="6" fill="rgba(0, 245, 255, 0.15)" stroke="#00f5ff" stroke-width="1"/>
  <text x="492" y="85" fill="#00f5ff" font-size="11" font-weight="bold" font-family="sans-serif">SEARCH</text>

  <!-- Main Weather Dashboard Card -->
  <rect x="25" y="116" width="350" height="215" rx="10" fill="rgba(11, 20, 50, 0.8)" stroke="rgba(0, 245, 255, 0.2)"/>
  
  <!-- Weather Icon & Temperature -->
  <g transform="translate(45, 135)">
    <!-- Sun -->
    <circle cx="45" cy="45" r="22" fill="url(#sunGrad)" filter="url(#weatherGlow)"/>
    <!-- Cloud overlapping -->
    <path d="M 40 55 H 85 A 16 16 0 0 0 85 24 A 20 20 0 0 0 48 20 A 18 18 0 0 0 40 55 Z" fill="#38bdf8" opacity="0.85"/>
  </g>

  <text x="160" y="165" fill="#ffffff" font-size="38" font-weight="800" font-family="sans-serif">28°C</text>
  <text x="162" y="186" fill="#00f5ff" font-size="13" font-weight="600" font-family="sans-serif">Partly Cloudy &#8226; Daylight</text>
  <text x="162" y="202" fill="#94a3b8" font-size="11" font-family="sans-serif">High: 31°C | Low: 22°C</text>

  <!-- Weather Metrics Row -->
  <line x1="45" y1="220" x2="355" y2="220" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <text x="45" y="245" fill="#94a3b8" font-size="10" font-family="sans-serif">HUMIDITY</text>
  <text x="45" y="265" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">58%</text>

  <text x="135" y="245" fill="#94a3b8" font-size="10" font-family="sans-serif">WIND SPEED</text>
  <text x="135" y="265" fill="#00f5ff" font-size="14" font-weight="bold" font-family="sans-serif">14 km/h</text>

  <text x="235" y="245" fill="#94a3b8" font-size="10" font-family="sans-serif">PRESSURE</text>
  <text x="235" y="265" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">1012 hPa</text>

  <text x="315" y="245" fill="#94a3b8" font-size="10" font-family="sans-serif">UV INDEX</text>
  <text x="315" y="265" fill="#fbbf24" font-size="14" font-weight="bold" font-family="sans-serif">Moderate</text>

  <!-- Django & Weather API Info Strip -->
  <rect x="45" y="285" width="310" height="30" rx="6" fill="#060c22"/>
  <text x="58" y="304" fill="#a855f7" font-size="10" font-family="monospace">&gt; DJANGO BACKEND + OPENWEATHER API INTEGRATED</text>

  <!-- Right Forecast Cards -->
  <rect x="390" y="116" width="185" height="215" rx="10" fill="rgba(11, 20, 50, 0.8)" stroke="rgba(168, 85, 247, 0.2)"/>
  <text x="405" y="140" fill="#c084fc" font-size="11" font-weight="bold" font-family="sans-serif">5-DAY FORECAST</text>

  <!-- Day 1 -->
  <rect x="405" y="152" width="155" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="415" y="170" fill="#f8fafc" font-size="10" font-family="sans-serif">Mon &#8226; Sunny</text>
  <text x="525" y="170" fill="#00f5ff" font-size="10" font-weight="bold" font-family="sans-serif">29°C</text>

  <!-- Day 2 -->
  <rect x="405" y="186" width="155" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="415" y="204" fill="#f8fafc" font-size="10" font-family="sans-serif">Tue &#8226; Rain</text>
  <text x="525" y="204" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">24°C</text>

  <!-- Day 3 -->
  <rect x="405" y="220" width="155" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="415" y="238" fill="#f8fafc" font-size="10" font-family="sans-serif">Wed &#8226; Cloudy</text>
  <text x="525" y="238" fill="#00f5ff" font-size="10" font-weight="bold" font-family="sans-serif">26°C</text>

  <!-- Day 4 -->
  <rect x="405" y="254" width="155" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="415" y="272" fill="#f8fafc" font-size="10" font-family="sans-serif">Thu &#8226; Sunny</text>
  <text x="525" y="272" fill="#00f5ff" font-size="10" font-weight="bold" font-family="sans-serif">30°C</text>

  <!-- Day 5 -->
  <rect x="405" y="288" width="155" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="415" y="306" fill="#f8fafc" font-size="10" font-family="sans-serif">Fri &#8226; Clear</text>
  <text x="525" y="306" fill="#10b981" font-size="10" font-weight="bold" font-family="sans-serif">31°C</text>

</svg>
