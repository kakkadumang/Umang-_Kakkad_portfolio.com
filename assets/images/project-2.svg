<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b24"/>
      <stop offset="100%" stop-color="#020412"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 255, 0.3)"/>
      <stop offset="100%" stop-color="rgba(0, 245, 255, 0)"/>
    </linearGradient>
    <filter id="p2Glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p2Bg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0c1230"/>
  <path d="M0 26 h600 v16 h-600 z" fill="#0c1230"/>
  <circle cx="28" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="46" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>
  <text x="95" y="25" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">CYBERSTREAM TERMINAL</text>
  <rect x="470" y="12" width="105" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)"/>
  <circle cx="482" cy="21" r="3.5" fill="#10b981"/>
  <text x="492" y="24" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">LIVE FEED</text>

  <!-- Market Stats Bar -->
  <rect x="25" y="58" width="550" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)"/>
  <text x="45" y="77" fill="#94a3b8" font-size="10" font-family="sans-serif">TOTAL VOLUME</text>
  <text x="45" y="95" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">$428.9M</text>
  
  <text x="210" y="77" fill="#94a3b8" font-size="10" font-family="sans-serif">GAS PRICE</text>
  <text x="210" y="95" fill="#00f5ff" font-size="14" font-weight="bold" font-family="sans-serif">12 Gwei</text>

  <text x="360" y="77" fill="#94a3b8" font-size="10" font-family="sans-serif">24H CHANGE</text>
  <text x="360" y="95" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">+14.28% ▲</text>

  <text x="480" y="77" fill="#94a3b8" font-size="10" font-family="sans-serif">STATUS</text>
  <text x="480" y="95" fill="#a855f7" font-size="14" font-weight="bold" font-family="sans-serif">OPTIMAL</text>

  <!-- Main Chart Canvas -->
  <rect x="25" y="118" width="370" height="215" rx="8" fill="rgba(9, 14, 38, 0.8)" stroke="rgba(0, 245, 255, 0.15)"/>
  
  <!-- Grid Lines -->
  <line x1="45" y1="160" x2="375" y2="160" stroke="rgba(255, 255, 255, 0.05)"/>
  <line x1="45" y1="205" x2="375" y2="205" stroke="rgba(255, 255, 255, 0.05)"/>
  <line x1="45" y1="250" x2="375" y2="250" stroke="rgba(255, 255, 255, 0.05)"/>
  <line x1="45" y1="295" x2="375" y2="295" stroke="rgba(255, 255, 255, 0.05)"/>

  <!-- Chart Curve & Area -->
  <path d="M 45 270 Q 100 290 140 230 T 220 180 T 290 200 T 365 140 L 365 310 L 45 310 Z" fill="url(#areaFill)"/>
  <path d="M 45 270 Q 100 290 140 230 T 220 180 T 290 200 T 365 140" fill="none" stroke="url(#lineGlow)" stroke-width="3" filter="url(#p2Glow)"/>

  <!-- Glowing Point -->
  <circle cx="365" cy="140" r="5" fill="#10b981" filter="url(#p2Glow)"/>

  <!-- Order Book & Telemetry Right Pane -->
  <rect x="410" y="118" width="165" height="215" rx="8" fill="rgba(9, 14, 38, 0.8)" stroke="rgba(168, 85, 247, 0.15)"/>
  <text x="425" y="142" fill="#c084fc" font-size="11" font-weight="bold" font-family="sans-serif">LIVE ORDER DEPTH</text>

  <!-- Green Bids -->
  <rect x="425" y="160" width="135" height="14" rx="3" fill="rgba(16, 185, 129, 0.12)"/>
  <rect x="425" y="160" width="85" height="14" rx="3" fill="rgba(16, 185, 129, 0.3)"/>
  <text x="430" y="171" fill="#10b981" font-size="9" font-family="monospace">0.842 BTC</text>
  <text x="515" y="171" fill="#94a3b8" font-size="9" font-family="monospace">$68,240</text>

  <rect x="425" y="180" width="135" height="14" rx="3" fill="rgba(16, 185, 129, 0.12)"/>
  <rect x="425" y="180" width="115" height="14" rx="3" fill="rgba(16, 185, 129, 0.3)"/>
  <text x="430" y="191" fill="#10b981" font-size="9" font-family="monospace">1.250 BTC</text>
  <text x="515" y="191" fill="#94a3b8" font-size="9" font-family="monospace">$68,235</text>

  <!-- Red Asks -->
  <rect x="425" y="210" width="135" height="14" rx="3" fill="rgba(244, 63, 94, 0.12)"/>
  <rect x="425" y="210" width="95" height="14" rx="3" fill="rgba(244, 63, 94, 0.3)"/>
  <text x="430" y="221" fill="#f43f5e" font-size="9" font-family="monospace">0.510 BTC</text>
  <text x="515" y="221" fill="#94a3b8" font-size="9" font-family="monospace">$68,255</text>

  <rect x="425" y="230" width="135" height="14" rx="3" fill="rgba(244, 63, 94, 0.12)"/>
  <rect x="425" y="230" width="60" height="14" rx="3" fill="rgba(244, 63, 94, 0.3)"/>
  <text x="430" y="241" fill="#f43f5e" font-size="9" font-family="monospace">0.320 BTC</text>
  <text x="515" y="241" fill="#94a3b8" font-size="9" font-family="monospace">$68,260</text>

  <!-- Mini execution pill -->
  <rect x="425" y="280" width="135" height="36" rx="6" fill="rgba(0, 245, 255, 0.1)" stroke="#00f5ff" stroke-width="1"/>
  <text x="445" y="303" fill="#00f5ff" font-size="10" font-weight="bold" font-family="sans-serif">EXECUTE SWAP</text>
</svg>
