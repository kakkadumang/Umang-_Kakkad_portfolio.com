<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="atmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f26"/>
      <stop offset="100%" stop-color="#040714"/>
    </linearGradient>
    <linearGradient id="atmCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="atmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="atmGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#atmBg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1.5"/>

  <!-- Desktop App Window Bar -->
  <rect x="0" y="0" width="600" height="40" rx="16" fill="#0b1333"/>
  <path d="M0 24 h600 v16 h-600 z" fill="#0b1333"/>
  <circle cx="28" cy="20" r="5" fill="#f43f5e"/>
  <circle cx="46" cy="20" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="20" r="5" fill="#10b981"/>
  <text x="95" y="24" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">SECURE ATM MODULE &#8212; TRANSACTION &amp; SERVICES HUB</text>
  <rect x="475" y="10" width="105" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="488" y="24" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">&#x25cf; SECURE TLS</text>

  <!-- Left ATM Screen / Card Reader View -->
  <rect x="25" y="58" width="350" height="275" rx="10" fill="rgba(10, 18, 48, 0.85)" stroke="rgba(0, 245, 255, 0.25)"/>
  
  <!-- ATM Terminal Header -->
  <rect x="40" y="72" width="320" height="42" rx="6" fill="#060c22" stroke="rgba(0, 245, 255, 0.15)"/>
  <text x="55" y="92" fill="#94a3b8" font-size="10" font-family="sans-serif">AUTHENTICATED ACCOUNT</text>
  <text x="55" y="106" fill="#f8fafc" font-size="12" font-weight="bold" font-family="monospace">ACC-NO: **** **** 8492</text>
  <text x="260" y="98" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">ACTIVE</text>

  <!-- ATM Operations Grid -->
  <!-- Cash Withdrawal -->
  <rect x="40" y="124" width="150" height="42" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="#00f5ff" stroke-width="1"/>
  <text x="52" y="145" fill="#00f5ff" font-size="10" font-weight="bold" font-family="sans-serif">&#x25ba; CASH WITHDRAWAL</text>
  <text x="52" y="157" fill="#94a3b8" font-size="9" font-family="sans-serif">Fast Cash / Custom</text>

  <!-- Balance Inquiry -->
  <rect x="210" y="124" width="150" height="42" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="222" y="145" fill="#f8fafc" font-size="10" font-weight="bold" font-family="sans-serif">&#x25ba; BALANCE INQUIRY</text>
  <text x="222" y="157" fill="#94a3b8" font-size="9" font-family="sans-serif">Real-time SQL Sync</text>

  <!-- Fund Transfer -->
  <rect x="40" y="176" width="150" height="42" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="52" y="197" fill="#f8fafc" font-size="10" font-weight="bold" font-family="sans-serif">&#x25ba; FUND TRANSFER</text>
  <text x="52" y="209" fill="#94a3b8" font-size="9" font-family="sans-serif">Inter-bank / Direct</text>

  <!-- PIN Change &amp; Services -->
  <rect x="210" y="176" width="150" height="42" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="#a855f7" stroke-width="1"/>
  <text x="222" y="197" fill="#c084fc" font-size="10" font-weight="bold" font-family="sans-serif">&#x25ba; PIN MANAGEMENT</text>
  <text x="222" y="209" fill="#94a3b8" font-size="9" font-family="sans-serif">Encrypted Salt &amp; Hash</text>

  <!-- Mini Transaction Log inside terminal -->
  <rect x="40" y="230" width="320" height="88" rx="6" fill="#040817" stroke="rgba(255, 255, 255, 0.06)"/>
  <text x="52" y="248" fill="#a855f7" font-size="9" font-weight="bold" font-family="monospace">&gt; SQL LEDGER AUDIT LOG</text>
  <text x="52" y="265" fill="#94a3b8" font-size="9" font-family="monospace">TXN_7849: WITHDRAWAL &#x20B9;2,000 &#8226; SUCCESS</text>
  <text x="52" y="282" fill="#94a3b8" font-size="9" font-family="monospace">TXN_7848: PIN_VALIDATION &#8226; VERIFIED</text>
  <text x="52" y="299" fill="#10b981" font-size="9" font-family="monospace">STATUS: DATABASE TRANSACTION COMMITTED</text>


  <!-- Right: ATM Machine &amp; Keypad Visual -->
  <rect x="395" y="58" width="180" height="275" rx="10" fill="rgba(10, 18, 48, 0.85)" stroke="rgba(168, 85, 247, 0.25)"/>
  
  <!-- Smart Card Chip Graphic -->
  <g transform="translate(425, 75)">
    <rect width="120" height="75" rx="8" fill="url(#atmGold)" opacity="0.9" filter="url(#atmGlow)"/>
    <rect x="15" y="20" width="30" height="24" rx="4" fill="#92400e" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="15" y1="32" x2="45" y2="32" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="30" y1="20" x2="30" y2="44" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="15" y="62" fill="#1e1b4b" font-family="monospace" font-size="11" font-weight="bold">ATM DEBIT</text>
  </g>

  <!-- PIN Pad Mock -->
  <g transform="translate(425, 170)">
    <rect x="0" y="0" width="120" height="145" rx="8" fill="#060c22" stroke="rgba(255, 255, 255, 0.1)"/>
    <!-- Keys 1-3 -->
    <rect x="12" y="12" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="21" y="28" fill="#00f5ff" font-size="10" font-family="sans-serif">1</text>
    <rect x="47" y="12" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="56" y="28" fill="#00f5ff" font-size="10" font-family="sans-serif">2</text>
    <rect x="82" y="12" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="91" y="28" fill="#00f5ff" font-size="10" font-family="sans-serif">3</text>

    <!-- Keys 4-6 -->
    <rect x="12" y="44" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="21" y="60" fill="#00f5ff" font-size="10" font-family="sans-serif">4</text>
    <rect x="47" y="44" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="56" y="60" fill="#00f5ff" font-size="10" font-family="sans-serif">5</text>
    <rect x="82" y="44" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="91" y="60" fill="#00f5ff" font-size="10" font-family="sans-serif">6</text>

    <!-- Keys 7-9 -->
    <rect x="12" y="76" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="21" y="92" fill="#00f5ff" font-size="10" font-family="sans-serif">7</text>
    <rect x="47" y="76" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="56" y="92" fill="#00f5ff" font-size="10" font-family="sans-serif">8</text>
    <rect x="82" y="76" width="26" height="24" rx="4" fill="#0d1430" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="91" y="92" fill="#00f5ff" font-size="10" font-family="sans-serif">9</text>

    <!-- Enter / Clear -->
    <rect x="12" y="108" width="44" height="24" rx="4" fill="#ef4444"/>
    <text x="20" y="124" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif">CLR</text>
    <rect x="64" y="108" width="44" height="24" rx="4" fill="#10b981"/>
    <text x="73" y="124" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif">OK</text>
  </g>
</svg>
