<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f29"/>
      <stop offset="100%" stop-color="#050716"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="p1Glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p1Bg)"/>
  <rect x="1" y="1" width="598" height="358" rx="15" fill="none" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0c1433"/>
  <path d="M0 26 h600 v16 h-600 z" fill="#0c1433"/>
  <circle cx="28" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="46" cy="21" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>
  <rect x="180" y="12" width="240" height="18" rx="9" fill="rgba(255, 255, 255, 0.06)"/>
  <text x="240" y="25" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">nexus-ai-workspace.io</text>

  <!-- Left Sidebar Mock -->
  <rect x="20" y="60" width="130" height="280" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
  <rect x="35" y="80" width="100" height="14" rx="4" fill="url(#cyanGrad)" opacity="0.8"/>
  <rect x="35" y="110" width="75" height="10" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="35" y="130" width="85" height="10" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="35" y="150" width="65" height="10" rx="3" fill="rgba(255, 255, 255, 0.15)"/>
  <rect x="35" y="185" width="90" height="10" rx="3" fill="url(#purpleGrad)" opacity="0.6"/>
  <rect x="35" y="205" width="80" height="10" rx="3" fill="rgba(255, 255, 255, 0.15)"/>

  <!-- Main AI Canvas Area -->
  <rect x="165" y="60" width="415" height="170" rx="8" fill="rgba(12, 20, 50, 0.7)" stroke="rgba(0, 245, 255, 0.2)"/>
  
  <!-- Neural Nodes in Action -->
  <line x1="210" y1="140" x2="310" y2="100" stroke="#00f5ff" stroke-width="2" opacity="0.7" filter="url(#p1Glow)"/>
  <line x1="310" y1="100" x2="420" y2="150" stroke="#a855f7" stroke-width="2" opacity="0.7" filter="url(#p1Glow)"/>
  <line x1="210" y1="140" x2="330" y2="180" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="330" y1="180" x2="420" y2="150" stroke="#00f5ff" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="520" y2="110" stroke="#00f5ff" stroke-width="2" filter="url(#p1Glow)"/>

  <!-- Glowing Nodes -->
  <circle cx="210" cy="140" r="14" fill="#0a0f29" stroke="#00f5ff" stroke-width="3" filter="url(#p1Glow)"/>
  <text x="204" y="144" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">IN</text>
  
  <circle cx="310" cy="100" r="18" fill="#0a0f29" stroke="#a855f7" stroke-width="3" filter="url(#p1Glow)"/>
  <text x="303" y="104" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">AI</text>

  <circle cx="330" cy="180" r="12" fill="#0a0f29" stroke="#3b82f6" stroke-width="2"/>

  <circle cx="420" cy="150" r="18" fill="#0a0f29" stroke="#00f5ff" stroke-width="3" filter="url(#p1Glow)"/>
  <text x="412" y="154" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">LLM</text>

  <circle cx="520" cy="110" r="15" fill="#0a0f29" stroke="#10b981" stroke-width="3" filter="url(#p1Glow)"/>
  <text x="510" y="114" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">OUT</text>

  <!-- Lower Metric Cards -->
  <rect x="165" y="245" width="130" height="95" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)"/>
  <text x="180" y="272" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Throughput</text>
  <text x="180" y="302" fill="#00f5ff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">12.4k/s</text>
  <rect x="180" y="318" width="90" height="4" rx="2" fill="url(#cyanGrad)"/>

  <rect x="307" y="245" width="130" height="95" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)"/>
  <text x="322" y="272" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Latency</text>
  <text x="322" y="302" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">18ms</text>
  <rect x="322" y="318" width="80" height="4" rx="2" fill="url(#purpleGrad)"/>

  <rect x="450" y="245" width="130" height="95" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)"/>
  <text x="465" y="272" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Accuracy</text>
  <text x="465" y="302" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold">99.8%</text>
  <rect x="465" y="318" width="100" height="4" rx="2" fill="#10b981"/>
</svg>
